name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            ext: ""
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            ext: ""
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            ext: ".exe"
            archive: zip
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
            ext: ".exe"
            archive: zip
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure cross-compilation linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          echo '[target.aarch64-unknown-linux-gnu]' >> .cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> .cargo/config.toml

      - name: Build
        run: cargo build --release -p zetmq-server --target ${{ matrix.target }}
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../zetmq-server-${{ github.ref_name }}-${{ matrix.target }}.tar.gz zetmq-server${{ matrix.ext }}

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/zetmq-server${{ matrix.ext }}" -DestinationPath "zetmq-server-${{ github.ref_name }}-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zetmq-server-${{ matrix.target }}
          path: |
            zetmq-server-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            zetmq-server-${{ github.ref_name }}-${{ matrix.target }}.zip
          if-no-files-found: warn

  create-release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz *.zip > ../checksums-sha256.txt 2>/dev/null || true
          mv ../checksums-sha256.txt .

      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          if [ -z "$PREVIOUS_TAG" ]; then
            BODY=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            BODY=$(git log --pretty=format:"- %s (%h)" ${PREVIOUS_TAG}..HEAD)
          fi
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## Changes
            ${{ steps.changelog.outputs.body }}

            ## Installation
            Download the binary for your platform below, or install via cargo:
            ```
            cargo install zetmq-server
            ```

            ## Checksums
            See `checksums-sha256.txt` for file integrity verification.
          files: |
            artifacts/*
          fail_on_unmatched_files: false

  publish-crates:
    name: Publish to crates.io
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: Cargo login
        run: cargo login ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish zetmq-protocol
        run: cargo publish -p zetmq-protocol --dry-run && cargo publish -p zetmq-protocol
        continue-on-error: true

      - name: Wait for index propagation
        run: sleep 15

      - name: Publish zetmq-core
        run: cargo publish -p zetmq-core --dry-run && cargo publish -p zetmq-core
        continue-on-error: true

      - name: Wait for index propagation
        run: sleep 15

      - name: Publish zetmq-store
        run: cargo publish -p zetmq-store --dry-run && cargo publish -p zetmq-store
        continue-on-error: true

      - name: Wait for index propagation
        run: sleep 15

      - name: Publish zetmq-client
        run: cargo publish -p zetmq-client --dry-run && cargo publish -p zetmq-client
        continue-on-error: true

      - name: Wait for index propagation
        run: sleep 15

      - name: Publish zetmq-server
        run: cargo publish -p zetmq-server --dry-run && cargo publish -p zetmq-server
        continue-on-error: true

  docker:
    name: Docker image (ghcr.io)
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image
        run: |
          IMAGE_NAME="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/zetmq-server"
          echo "name=${IMAGE_NAME}" >> $GITHUB_OUTPUT

      - name: Extract version
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Sign image with Cosign (keyless)
        uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.image.outputs.name }}:${{ steps.meta.outputs.version }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest SBOM with Cosign
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ steps.meta.outputs.version }}
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table

      - name: GitHub provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
