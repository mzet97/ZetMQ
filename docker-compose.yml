services:
  zetmq:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4222:4222"
      - "8222:8222"
    environment:
      - RUST_LOG=${RUST_LOG:-info}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8222/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    networks:
      - zetmq-net
    restart: unless-stopped

networks:
  zetmq-net:
    driver: bridge
