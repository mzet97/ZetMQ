[workspace]
resolver = "2"
members = [
    "crates/zetmq-core",
    "crates/zetmq-protocol",
    "crates/zetmq-server",
    "crates/zetmq-client",
    "crates/zetmq-store",
    "crates/zetmq-bench",
    "crates/zetmq-tests",
]

[workspace.package]
version = "0.2.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/mzet97/ZetMQ"

[workspace.dependencies]
bytes = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
smallvec = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
